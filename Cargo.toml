[workspace]
resolver = "3"
members = [
  "margin",
  "margin-term",
  "snark",
  "snark-dsl",
  "snark-playground",
  "snark-scanner-host",
  "snark-ts-diff",
  "snark-wasm",
]

[workspace.package]
version = "0.10.0-rc.2"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/snark"
homepage = "https://github.com/bearcove/snark"

[workspace.dependencies]
aho-corasick = "1.1.4"
blake3 = "1.8.6"
arborium-theme = "2.4.5"
cc = "1.0.87"
facet-styx = "5.0.0-rc.5"
gingembre-syntax = "0.0.1"
rediff = "0.50.0-rc.7"
facet = "0.50.0-rc.7"
facet-value = "0.50.0-rc.7"
facet-postcard = "0.50.0-rc.7"
facet-json = "0.50.0-rc.7"
indexmap = { version = "2.12.1", default-features = false }
snark = { path = "snark", version = "0.0.2" }
snark-dsl = { path = "snark-dsl", version = "0.1.0" }
snark-scanner-host = { path = "snark-scanner-host" }
margin = { path = "margin", version = "0.10.0-rc.2" }
regex = { version = "1.12.4", default-features = false, features = ["std", "unicode"] }
regex-automata = { version = "0.4.14", default-features = false, features = ["std", "unicode", "meta", "perf", "hybrid"] }
smallvec = { version = "1.15", default-features = false }
unicode-width = "0.2.2"
wasm-bindgen = "0.2"
weavy = "0.2.3-rc.0"



[workspace.lints.rust]

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
