[workspace]
resolver = "3"
members = [
  "margin",
  "margin-term",
  "snark",
  "snark-dsl",
  "snark-playground",
  "snark-scanner-host",
  "snark-ts-diff",
  "snark-wasm",
]

[workspace.package]
version = "0.10.0-rc.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/snark"
homepage = "https://github.com/bearcove/snark"

[workspace.dependencies]
aho-corasick = "1.1.4"
blake3 = "1.8.6"
arborium-theme = "2.4.5"
cc = "1.0.87"
facet-styx = { git = "https://github.com/bearcove/styx", rev = "67bf0b6c8e724f90b498281667e0bbb5fd93225d" }
gingembre-syntax = { git = "https://github.com/bearcove/dodeca", rev = "20131be7d72286b2c45a6e2d652c361892e84d47" }
rediff = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-postcard = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-json = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
indexmap = { version = "2.12.1", default-features = false }
snark = { path = "snark", version = "0.0.1" }
snark-dsl = { path = "snark-dsl" }
snark-scanner-host = { path = "snark-scanner-host" }
margin = { path = "margin", version = "0.10.0-rc.1" }
regex = { version = "1.12.4", default-features = false, features = ["std", "unicode"] }
regex-automata = { version = "0.4.14", default-features = false, features = ["std", "unicode", "meta", "perf", "hybrid"] }
smallvec = { version = "1.15", default-features = false }
unicode-width = "0.2.2"
wasm-bindgen = "0.2"
weavy = { git = "https://github.com/bearcove/weavy", rev = "743a7abe8f999ab4122df1cc02e2441849210a23" }
weavy-phon = { path = "../weavy/weavy-phon" }
phon = { path = "../phon/rust/phon" }

[patch.crates-io]
copypatch = { git = "https://github.com/bearcove/weavy", rev = "743a7abe8f999ab4122df1cc02e2441849210a23" }
taxon = { git = "https://github.com/bearcove/weavy", rev = "743a7abe8f999ab4122df1cc02e2441849210a23" }
weavy = { git = "https://github.com/bearcove/weavy", rev = "743a7abe8f999ab4122df1cc02e2441849210a23" }
weavy-phon = { path = "../weavy/weavy-phon" }

[patch."https://github.com/bearcove/weavy"]
copypatch = { path = "../weavy/copypatch" }
taxon = { path = "../weavy/taxon" }
weavy = { path = "../weavy/weavy" }


[workspace.lints.rust]

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
