[package]
name = "snark-dsl"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tree-sitter grammar DSL evaluation and typed AST generation for Snark."
readme = "README.md"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[features]
default = []
native = ["dep:tempfile"]
typed-ast = ["native", "dep:facet", "dep:facet-json", "dep:snark"]

[dependencies]
facet = { workspace = true, optional = true }
facet-json = { workspace = true, optional = true }
snark = { path = "../snark", version = "0.0.3", features = ["json-import"], optional = true }
tempfile = { version = "3.23.0", optional = true }
thiserror = "2.0.17"

[[bin]]
name = "snark-dsl"
path = "src/main.rs"
required-features = ["native"]
