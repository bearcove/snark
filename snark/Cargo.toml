[package]
name = "snark"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/snark"
description = "Tree-sitter-compatible grammar package model and Weavy lowering scaffold."
keywords = ["parsing", "tree-sitter", "incremental", "syntax"]
categories = ["parsing", "text-editors"]
readme = "README.md"
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "arborium-header.html",
    "build.rs",
    "docs/**",
    "examples/**",
    "src/**",
    "tests/fixtures/**",
]

[features]
default = ["json-import"]
ci = ["tree-sitter-import"]
json-import = ["dep:facet-json", "facet/indexmap"]
glr-diagnostics = []
tree-sitter-import = ["json-import"]

[dependencies]
aho-corasick.workspace = true
blake3.workspace = true
facet = { workspace = true, features = ["indexmap"] }
facet-value.workspace = true
facet-json = { workspace = true, optional = true }
facet-postcard.workspace = true
indexmap.workspace = true
regex.workspace = true
regex-automata.workspace = true
smallvec.workspace = true
weavy.workspace = true

[dev-dependencies]
facet-styx.workspace = true
gingembre-syntax.workspace = true
rediff.workspace = true
snark-dsl = { workspace = true, features = ["native"] }
snark-scanner-host.workspace = true

[[example]]
name = "weavy_bench"
required-features = ["json-import"]

[[example]]
name = "gingembre_corpus"
required-features = ["json-import"]

[[example]]
name = "arborium_check"
required-features = ["json-import"]

[[example]]
name = "pipeline_timing"
required-features = ["json-import"]

[[example]]
name = "artifact_timing"
required-features = ["json-import"]

[[example]]
name = "nginx_arborium_probe"
required-features = ["json-import"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]
